# /** THIS FILE DOES: refreshes the committed ISS OEM ephemeris snapshot every 12h, ROLE: Automation, MAINTAINER NOTE: NASA's OEM host lacks CORS so the browser can't fetch it directly; this job is the same-origin bridge (see src/layers/iss.js). **/
name: Live data
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-iss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-iss.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/live/iss-oem.json
          git diff --cached --quiet || git commit -m 'chore: refresh ISS OEM ephemeris'
          git push
